<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Scheduler</title>
<style>
/* ── RESET & TOKENS ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #F0F2F5;
  --surface:   #FFFFFF;
  --border:    #DDE1E7;
  --border2:   #C8CDD6;
  --text:      #111318;
  --text2:     #4B5263;
  --text3:     #8A93A6;
  --accent:    #1B55E8;
  --accent-bg: #EEF3FF;
  --success:   #15803D;
  --radius:    6px;
  --shadow:    0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.13);

  /* customer type colours */
  --c-costco:  #2563EB;
  --c-lowes:   #16A34A;
  --c-core:    #64748B;
  --c-service: #DC2626;
  --c-gold:    #B45309;
  --c-purple:  #7C3AED;
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── TOPBAR ─────────────────────────────────────────────────────────────── */
#topbar { background: var(--surface); border-bottom: 1px solid var(--border); height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; }
.logo { font-size: 14px; font-weight: 800; letter-spacing: -.4px; color: var(--text); margin-right: 8px; }
.logo span { color: var(--accent); }
.divider { width: 1px; height: 20px; background: var(--border); }
.week-nav { display: flex; align-items: center; gap: 6px; }
.week-label { font-size: 13px; font-weight: 600; min-width: 160px; text-align: center; }
.nav-btn { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: var(--text2); transition: background .1s; }
.nav-btn:hover { background: var(--bg); }
.spacer { flex: 1; }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.view-btn { padding: 4px 12px; font-size: 12px; font-weight: 500; border: none; background: transparent; cursor: pointer; color: var(--text2); font-family: inherit; transition: background .1s, color .1s; }
.view-btn.active { background: var(--accent); color: #fff; }
.role-select { font-family: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); cursor: pointer; }
.btn { padding: 5px 12px; border-radius: 5px; border: none; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s, opacity .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #1444c0; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-ghost:hover { background: var(--bg); }
.btn-pub { background: #15803D; color: #fff; }
.btn-pub:hover { background: #166534; }
.published-badge { background: #DCFCE7; color: #15803D; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; display: none; }

/* ── MAIN ───────────────────────────────────────────────────────────────── */
#main { flex: 1; display: flex; overflow: hidden; }

/* ── GRID AREA ──────────────────────────────────────────────────────────── */
#grid-area { flex: 1; overflow: auto; padding: 12px; }

/* ── WEEKLY GRID ────────────────────────────────────────────────────────── */
.week-grid { min-width: 820px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.week-header { display: grid; grid-template-columns: 140px repeat(7, 1fr); border-bottom: 2px solid var(--border); background: var(--bg); }
.wh-installer { padding: 8px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.wh-day { padding: 8px 6px; text-align: center; border-left: 1px solid var(--border); }
.wh-day .day-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text3); }
.wh-day .day-date { font-size: 15px; font-weight: 700; color: var(--text); margin: 1px 0; }
.wh-day.today .day-date { color: var(--accent); }
.wh-day .day-rev { font-size: 11px; font-weight: 600; color: var(--success); margin-top: 1px; }

/* installer row */
.installer-row { display: grid; grid-template-columns: 140px repeat(7, 1fr); border-top: 1px solid var(--border); min-height: 80px; }
.installer-row:hover { background: #FAFBFC; }
.installer-cell { padding: 8px 10px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--border); position: sticky; left: 0; background: inherit; z-index: 2; }
.installer-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; flex-shrink: 0; }
.installer-name { font-size: 12px; font-weight: 600; line-height: 1.3; }
.day-cell { border-left: 1px solid var(--border); padding: 4px; min-height: 80px; vertical-align: top; position: relative; transition: background .1s; }
.day-cell.drag-over { background: var(--accent-bg); outline: 2px dashed var(--accent); outline-offset: -2px; }
.day-cell.today-col { background: #FAFCFF; }

/* unassigned row */
.unassigned-row { display: grid; grid-template-columns: 140px repeat(7, 1fr); border-top: 2px dashed var(--border2); background: #FAFAFA; min-height: 60px; }
.unassigned-label { padding: 8px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text3); letter-spacing: .06em; display: flex; align-items: center; border-right: 1px solid var(--border); position: sticky; left: 0; background: #FAFAFA; z-index: 2; }

/* ── JOB CARD ───────────────────────────────────────────────────────────── */
.job-card {
  border-radius: 5px;
  margin-bottom: 3px;
  padding: 4px 6px;
  cursor: grab;
  position: relative;
  border: 1px solid rgba(0,0,0,.08);
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  transition: box-shadow .1s, opacity .15s, transform .1s;
  user-select: none;
  overflow: hidden;
}
.job-card:active { cursor: grabbing; opacity: .85; transform: scale(1.01); box-shadow: var(--shadow-lg); }
.job-card.dragging { opacity: .4; }
.job-card-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 5px 0 0 5px; }
.job-card-inner { padding-left: 6px; }
.job-card-name { font-size: 12px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-card-meta { display: flex; align-items: center; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
.job-card-rev { font-size: 11px; font-weight: 700; color: var(--success); }
.job-card-city { font-size: 10px; color: var(--text2); }
.job-card-days { font-size: 10px; background: rgba(0,0,0,.07); border-radius: 3px; padding: 1px 4px; color: var(--text2); }
.job-card-installer { font-size: 10px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 1px; }
.confirm-check { position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--success); font-weight: 900; }

/* customer type bg tints */
.ct-costco  { background: #EFF6FF; }
.ct-lowes   { background: #F0FDF4; }
.ct-core    { background: #F8FAFC; }
.ct-service { background: #FEF2F2; }
.ct-gold    { background: #FFFBEB; }
.ct-purple  { background: #FAF5FF; }
.bar-costco  { background: var(--c-costco); }
.bar-lowes   { background: var(--c-lowes); }
.bar-core    { background: var(--c-core); }
.bar-service { background: var(--c-service); }
.bar-gold    { background: var(--c-gold); }
.bar-purple  { background: var(--c-purple); }
.text-costco  { color: var(--c-costco); }
.text-lowes   { color: var(--c-lowes); }
.text-core    { color: var(--c-core); }
.text-service { color: var(--c-service); }
.text-gold    { color: var(--c-gold); }
.text-purple  { color: var(--c-purple); }

/* ── MONTHLY GRID ───────────────────────────────────────────────────────── */
.month-grid { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.month-header-row { display: grid; grid-template-columns: repeat(7,1fr); border-bottom: 2px solid var(--border); background: var(--bg); }
.month-day-header { padding: 6px; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); }
.month-days { display: grid; grid-template-columns: repeat(7,1fr); }
.month-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 90px; padding: 4px; transition: background .1s; cursor: pointer; }
.month-cell:nth-child(7n) { border-right: none; }
.month-cell.other-month { background: #FAFAFA; }
.month-cell.today-cell { background: var(--accent-bg); }
.month-cell .mc-num { font-size: 12px; font-weight: 700; margin-bottom: 3px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.month-cell.today-cell .mc-num { background: var(--accent); color: #fff; }
.month-cell.other-month .mc-num { color: var(--text3); }
.month-pill { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.month-more { font-size: 10px; color: var(--text3); padding: 1px 4px; }

/* ── SIDE PANEL ─────────────────────────────────────────────────────────── */
#side-panel { width: 360px; min-width: 360px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease; position: absolute; right: 0; top: 48px; bottom: 0; z-index: 40; box-shadow: var(--shadow-lg); }
#side-panel.open { transform: translateX(0); }
.panel-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.panel-title { font-size: 14px; font-weight: 700; }
.panel-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text3); line-height: 1; }
.panel-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-tab { padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text2); background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; transition: color .1s; }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; }
.panel-tab-content { display: none; }
.panel-tab-content.active { display: block; }

/* form elements */
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 4px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 5px; font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface); outline: none; transition: border .15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.ct-select { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.ct-opt { display: flex; align-items: center; gap: 5px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 600; transition: border-color .1s, background .1s; }
.ct-opt.selected { border-width: 2px; }
.ct-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.segments-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.segment-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg); border-radius: 5px; border: 1px solid var(--border); }
.segment-date { font-size: 12px; font-weight: 600; min-width: 80px; }
.segment-installer { flex: 1; }
.segment-rev { font-size: 12px; font-weight: 700; color: var(--success); min-width: 60px; text-align: right; }
.confirm-toggle { width: 18px; height: 18px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; transition: background .1s, border-color .1s; flex-shrink: 0; }
.confirm-toggle.confirmed { background: var(--success); border-color: var(--success); color: #fff; }
.panel-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }

/* audit log */
.audit-entry { padding: 8px 0; border-bottom: 1px solid var(--border); }
.audit-entry:last-child { border-bottom: none; }
.audit-action { font-size: 12px; font-weight: 600; }
.audit-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.audit-detail { font-size: 11px; color: var(--text2); margin-top: 2px; background: var(--bg); padding: 3px 6px; border-radius: 3px; font-family: monospace; }

/* ── INSTALLER MANAGER MODAL ────────────────────────────────────────────── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 10px; width: 420px; max-width: 95vw; padding: 20px; box-shadow: var(--shadow-lg); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text3); }
.installer-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.installer-item:last-child { border-bottom: none; }
.installer-item-name { flex: 1; font-size: 13px; font-weight: 500; }
.btn-icon { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; color: var(--text2); }
.btn-icon.danger { color: var(--c-service); border-color: #FCA5A5; }
.btn-icon:hover { background: var(--bg); }

/* ── TOOLTIP ────────────────────────────────────────────────────────────── */
.tooltip { position: fixed; background: #1A1D23; color: #fff; border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.5; max-width: 220px; z-index: 999; pointer-events: none; display: none; box-shadow: var(--shadow-lg); }
.tooltip.visible { display: block; }
.tooltip-row { display: flex; justify-content: space-between; gap: 12px; }
.tooltip-label { color: #9CA3AF; }
.tooltip-val { font-weight: 600; }

/* ── REVENUE BAR ────────────────────────────────────────────────────────── */
.rev-summary { display: flex; gap: 16px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; flex-shrink: 0; align-items: center; }
.rev-item { display: flex; align-items: center; gap: 4px; }
.rev-label { color: var(--text3); font-weight: 600; }
.rev-value { font-weight: 700; color: var(--success); }
.rev-total { font-size: 14px; }
.draft-pill { background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-left: auto; }
.published-pill { background: #DCFCE7; color: #14532D; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-left: auto; }

/* ── TOAST ──────────────────────────────────────────────────────────────── */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1A1D23; color: #fff; padding: 9px 18px; border-radius: 7px; font-size: 12px; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }

/* ── SCROLLBAR ──────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">Field<span>Sched</span></div>
  <div class="divider"></div>
  <div class="week-nav">
    <button class="nav-btn" onclick="navWeek(-1)">&#8249;</button>
    <div class="week-label" id="weekLabel"></div>
    <button class="nav-btn" onclick="navWeek(1)">&#8250;</button>
    <button class="btn btn-ghost" style="font-size:11px;padding:4px 9px" onclick="goToday()">Today</button>
  </div>
  <div class="divider"></div>
  <div class="view-toggle">
    <button class="view-btn active" id="btnWeek" onclick="setView('week')">Week</button>
    <button class="view-btn" id="btnMonth" onclick="setView('month')">Month</button>
  </div>
  <div class="spacer"></div>
  <select class="role-select" id="roleSelect" onchange="setRole(this.value)">
    <option value="scheduler">🗓 Scheduler</option>
    <option value="manager">📊 Manager</option>
    <option value="installer">🔧 Installer</option>
  </select>
  <button class="btn btn-ghost" onclick="openInstallerModal()" id="btnInstallers">Installers</button>
  <button class="btn btn-primary" onclick="openNewJob()" id="btnNewJob">+ New Job</button>
  <button class="btn btn-pub" onclick="publishWeek()" id="btnPublish">Publish Week</button>
</div>

<!-- REV SUMMARY BAR -->
<div class="rev-summary" id="revBar">
  <div class="rev-item"><span class="rev-label">Week Revenue:</span><span class="rev-value rev-total" id="revWeek">$0</span></div>
  <div class="rev-item" id="revBarDate" style="color:var(--text3);font-size:11px"></div>
  <span class="draft-pill" id="modePill">DRAFT</span>
</div>

<!-- MAIN -->
<div id="main">
  <div id="grid-area">
    <!-- filled by JS -->
  </div>
</div>

<!-- SIDE PANEL -->
<div id="side-panel">
  <div class="panel-header">
    <div class="panel-title" id="panelTitle">Job Details</div>
    <button class="panel-close" onclick="closePanel()">&#10005;</button>
  </div>
  <div class="panel-tabs" id="panelTabs">
    <button class="panel-tab active" onclick="switchTab('details')">Details</button>
    <button class="panel-tab" onclick="switchTab('segments')">Schedule</button>
    <button class="panel-tab" onclick="switchTab('audit')">History</button>
  </div>
  <div class="panel-body">
    <div class="panel-tab-content active" id="tab-details"></div>
    <div class="panel-tab-content" id="tab-segments"></div>
    <div class="panel-tab-content" id="tab-audit"></div>
  </div>
  <div class="panel-footer" id="panelFooter"></div>
</div>

<!-- INSTALLER MODAL -->
<div class="modal-overlay" id="installerModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Manage Installers</div>
      <button class="modal-close" onclick="closeInstallerModal()">&#10005;</button>
    </div>
    <div id="installerList"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <input class="form-input" id="newInstallerName" placeholder="Installer name" style="flex:1">
      <button class="btn btn-primary" onclick="addInstaller()">Add</button>
    </div>
  </div>
</div>

<!-- PUBLISH MODAL -->
<div class="modal-overlay" id="publishModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Publish Schedule</div>
      <button class="modal-close" onclick="closePublishModal()">&#10005;</button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Publishing makes this week's schedule visible to all users. Previous published version for this week will be overwritten.</p>
    <div style="background:var(--bg);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px;">
      <strong id="publishRangeLabel"></strong>
    </div>
    <div class="form-group">
      <label class="form-label">Published by</label>
      <select class="form-select" id="publishActor"></select>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closePublishModal()">Cancel</button>
      <button class="btn btn-pub" onclick="confirmPublish()">Publish</button>
    </div>
  </div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  DATA STORE
// ══════════════════════════════════════════════════════════════
const CT = {
  costco:  { label: 'Costco',   color: '#2563EB' },
  lowes:   { label: "Lowe's",   color: '#16A34A' },
  core:    { label: 'Core',     color: '#64748B' },
  service: { label: 'Service',  color: '#DC2626' },
  gold:    { label: 'Gold',     color: '#B45309' },
  purple:  { label: 'Custom',   color: '#7C3AED' },
};

let installers = [
  { id: 'i1', name: 'Marcus Webb' },
  { id: 'i2', name: 'Dario Reyes' },
  { id: 'i3', name: 'Tasha Osei' },
  { id: 'i4', name: 'Kyle Brandt' },
];

let jobs = [];        // master job records
let segments = [];    // per-day placement records
let auditLog = [];    // all changes
let publishedWeeks = {}; // key: 'YYYY-Www' -> snapshot
let nextJobId = 1;
let nextSegId = 1;

// ── seed data ─────────────────────────────────────────────────
function seedData() {
  const base = getMonday(new Date());
  function d(offset) {
    const dt = new Date(base);
    dt.setDate(dt.getDate() + offset);
    return dt.toISOString().slice(0,10);
  }

  const rawJobs = [
    { name: 'Costco Willow Creek', ct: 'costco', service: 'Full Install', revenue: 4200, address: '1200 Creek Blvd', city: 'Willow Creek', zip: '94025', days: [d(0), d(1)], installer: 'i1', notes: 'Bring scissor lift' },
    { name: "Lowe's Riverside", ct: 'lowes', service: 'Retrofit', revenue: 2800, address: '500 River Rd', city: 'Riverside', zip: '92501', days: [d(1)], installer: 'i2', notes: '' },

// ══════════════════════════════════════════════════════════════
//  DATE HELPERS
// ══════════════════════════════════════════════════════════════
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function addDays(d, n) { const dt = new Date(d); dt.setDate(dt.getDate() + n); return dt; }
function fmtDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function fmtDateFull(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
function dateStr(d) { return d.toISOString().slice(0,10); }
function todayStr() { return dateStr(new Date()); }
function weekKey(d) {
  const m = getMonday(d);
  const jan4 = new Date(m.getFullYear(), 0, 4);
  const week = Math.ceil(((m - jan4) / 86400000 + jan4.getDay() + 1) / 7);
  return `${m.getFullYear()}-W${String(week).padStart(2,'0')}`;
}

function weekDates() {
  return Array.from({ length: 7 }, (_, i) => dateStr(addDays(weekStart, i)));
}

function navWeek(dir) {
  weekStart = addDays(weekStart, dir * 7);
  monthStart = new Date(weekStart.getFullYear(), weekStart.getMonth(), 1);
  render();
}
function goToday() {
  weekStart = getMonday(new Date());
  monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  render();
}

// ══════════════════════════════════════════════════════════════
//  REVENUE CALCULATIONS
// ══════════════════════════════════════════════════════════════
function recalcJob(jobId) {
  const segs = segments.filter(s => s.jobId === jobId);
  const job = jobs.find(j => j.id === jobId);
  if (!job || segs.length === 0) return;
  const perDay = job.revenue / segs.length;
  segs.forEach(s => { s.dayRevenue = perDay; });
}

function weekRevenue() {
  const dates = new Set(weekDates());
  return segments.filter(s => dates.has(s.date)).reduce((sum, s) => sum + (s.dayRevenue || 0), 0);
}

function dayRevenue(date) {
  return segments.filter(s => s.date === date).reduce((sum, s) => sum + (s.dayRevenue || 0), 0);
}

function fmt$(n) { return '$' + Math.round(n).toLocaleString(); }

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function render() {
  const dates = weekDates();
  updateWeekLabel(dates);
  updateRevBar(dates);
  if (currentView === 'week') renderWeekGrid(dates);
  else renderMonthGrid();
}

function updateWeekLabel(dates) {
  const s = fmtDate(dates[0]);
  const e = fmtDate(dates[6]);
  document.getElementById('weekLabel').textContent = `${s} – ${e}`;
  document.getElementById('revBarDate').textContent = `${s} – ${e}`;
}

function updateRevBar(dates) {
  const total = weekRevenue();
  document.getElementById('revWeek').textContent = fmt$(total);
  const wk = weekKey(weekStart);
  const isPublished = !!publishedWeeks[wk];
  const pill = document.getElementById('modePill');
  pill.className = isPublished ? 'published-pill' : 'draft-pill';
  pill.textContent = isPublished ? 'PUBLISHED' : 'DRAFT';
}

// ── WEEK GRID ─────────────────────────────────────────────────
function renderWeekGrid(dates) {
  const ga = document.getElementById('grid-area');
  const today = todayStr();
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  let html = '<div class="week-grid">';

  // Header
  html += '<div class="week-header">';
  html += `<div class="wh-installer">Installer</div>`;
  dates.forEach((d, i) => {
    const isToday = d === today;
    const rev = dayRevenue(d);
    html += `<div class="wh-day ${isToday ? 'today' : ''}">
      <div class="day-name">${days[i]}</div>
      <div class="day-date">${new Date(d+'T00:00:00').getDate()}</div>
      ${role !== 'installer' ? `<div class="day-rev">${rev > 0 ? fmt$(rev) : ''}</div>` : ''}
    </div>`;
  });
  html += '</div>';

  // Installer rows
  installers.forEach(inst => {
    html += `<div class="installer-row">`;
    const initials = inst.name.split(' ').map(w => w[0]).join('').slice(0,2);
    const color = installerColor(inst.id);
    html += `<div class="installer-cell">
      <div class="installer-avatar" style="background:${color}">${initials}</div>
      <div class="installer-name">${inst.name}</div>
    </div>`;
    dates.forEach(d => {
      const isToday = d === today;
      html += `<div class="day-cell ${isToday ? 'today-col' : ''}"
        data-date="${d}" data-installer="${inst.id}"
        ondragover="onDragOver(event)" ondrop="onDrop(event,this)"
        ondragleave="onDragLeave(event)">`;
      const daySegs = segments.filter(s => s.date === d && s.installerId === inst.id);
      daySegs.forEach(seg => { html += renderJobCard(seg); });
      html += `</div>`;
    });
    html += `</div>`;
  });

  // Unassigned row
  html += `<div class="unassigned-row">`;
  html += `<div class="unassigned-label">Unscheduled</div>`;
  dates.forEach(d => {
    const isToday = d === today;
    html += `<div class="day-cell ${isToday ? 'today-col' : ''}"
      data-date="${d}" data-installer=""
      ondragover="onDragOver(event)" ondrop="onDrop(event,this)"
      ondragleave="onDragLeave(event)">`;
    const daySegs = segments.filter(s => s.date === d && !s.installerId);
    daySegs.forEach(seg => { html += renderJobCard(seg); });
    html += `</div>`;
  });
  html += `</div>`;
  html += '</div>';

  ga.innerHTML = html;
  attachCardListeners();
}

function renderJobCard(seg) {
  const job = jobs.find(j => j.id === seg.jobId);
  if (!job) return '';
  const ct = job.customerType || 'core';
  const inst = installers.find(i => i.id === seg.installerId);
  const instName = inst ? inst.name.split(' ')[0] : '—';
  const totalSegs = segments.filter(s => s.jobId === job.id).length;
  const isScheduler = role === 'scheduler';
  const rev = seg.dayRevenue || 0;

  return `<div class="job-card ct-${ct}"
    id="card-${seg.id}"
    draggable="${isScheduler}"
    data-segid="${seg.id}"
    onclick="openJob('${job.id}')"
    onmouseenter="showTooltip(event,'${seg.id}')"
    onmouseleave="hideTooltip()">
    <div class="job-card-bar bar-${ct}"></div>
    <div class="job-card-inner">
      <div class="job-card-name">${job.name}</div>
      <div class="job-card-meta">
        <span class="job-card-rev">${fmt$(rev)}</span>
        ${totalSegs > 1 ? `<span class="job-card-days">${totalSegs}d</span>` : ''}
        <span class="job-card-city">${job.city || ''}</span>
      </div>
      <div class="job-card-installer">${instName}</div>
    </div>
    ${seg.confirmed ? '<div class="confirm-check">✓</div>' : ''}
  </div>`;
}

function attachCardListeners() {
  document.querySelectorAll('.job-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragSegId = card.dataset.segid;
      setTimeout(() => card.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      dragSegId = null;
    });
  });
}

// ── MONTH GRID ────────────────────────────────────────────────
function renderMonthGrid() {
  const ga = document.getElementById('grid-area');
  const year = monthStart.getFullYear();
  const month = monthStart.getMonth();
  const today = todayStr();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = '<div class="month-grid">';
  html += '<div class="month-header-row">';
  days.forEach(d => { html += `<div class="month-day-header">${d}</div>`; });
  html += '</div><div class="month-days">';

  let cells = [];
  for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: prevDays - i, month: 'prev' });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, month: 'current' });
  while (cells.length % 7 !== 0) cells.push({ day: cells.length - firstDay - daysInMonth + 1, month: 'next' });

  cells.forEach(cell => {
    let dateS = '';
    if (cell.month === 'current') {
      dateS = `${year}-${String(month+1).padStart(2,'0')}-${String(cell.day).padStart(2,'0')}`;
    }
    const isToday = dateS === today;
    const isOther = cell.month !== 'current';
    html += `<div class="month-cell ${isOther ? 'other-month' : ''} ${isToday ? 'today-cell' : ''}"
      onclick="${dateS ? `openDayJobs('${dateS}')` : ''}">
      <div class="mc-num">${cell.day}</div>`;
    if (dateS) {
      const daySegs = segments.filter(s => s.date === dateS);
      const seen = new Set();
      const unique = daySegs.filter(s => { if (seen.has(s.jobId)) return false; seen.add(s.jobId); return true; });
      unique.slice(0,3).forEach(seg => {
        const job = jobs.find(j => j.id === seg.jobId);
        if (!job) return;
        const ct = job.customerType || 'core';
        const color = CT[ct]?.color || '#64748B';
        html += `<div class="month-pill" style="background:${color}18;color:${color}"
          onclick="event.stopPropagation();openJob('${job.id}')">${job.name}</div>`;
      });
      if (unique.length > 3) html += `<div class="month-more">+${unique.length-3} more</div>`;
    }
    html += `</div>`;
  });

  html += '</div></div>';
  ga.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
//  DRAG & DROP
// ══════════════════════════════════════════════════════════════
function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e, cell) {
  e.preventDefault();
  cell.classList.remove('drag-over');
  if (!dragSegId) return;

  const seg = segments.find(s => s.id === dragSegId);
  if (!seg) return;

  const newDate = cell.dataset.date;
  const newInstaller = cell.dataset.installer || null;

  const oldDate = seg.date;
  const oldInstaller = seg.installerId;

  if (newDate === oldDate && newInstaller === oldInstaller) return;

  const job = jobs.find(j => j.id === seg.jobId);

  // audit
  if (newDate !== oldDate) logAudit(seg.jobId, seg.id, 'move', 'date', oldDate, newDate);
  if (newInstaller !== oldInstaller) {
    const oldName = installers.find(i => i.id === oldInstaller)?.name || 'Unassigned';
    const newName = installers.find(i => i.id === newInstaller)?.name || 'Unassigned';
    logAudit(seg.jobId, seg.id, 'reassign', 'installer', oldName, newName);
  }

  seg.date = newDate;
  seg.installerId = newInstaller;
  recalcJob(seg.jobId);
  render();
  showToast(`${job?.name} moved to ${fmtDate(newDate)}`);
}

//  JOB CRUD
// ══════════════════════════════════════════════════════════════
function openNewJob() {
  const jobId = 'j' + nextJobId++;
  const today2 = dateStr(new Date());
  const defInst = installers[0]?.id || '';
  jobs.push({ id: jobId, name: 'New Job', customerType: 'core', serviceType: '', revenue: 0, address: '', city: '', zip: '', notes: '', createdAt: new Date().toISOString() });
  segments.push({ id: 's' + nextSegId++, jobId, installerId: defInst, date: today2, dayRevenue: 0, confirmed: false });
  logAudit(jobId, null, 'create', null, null, null, 'Job created');
  render();
  openJob(jobId);
  switchTab('details');
}

function updateJobField(jobId, field, value) {
  const job = jobs.find(j => j.id === jobId);
  if (!job) return;
  const old = job[field];
  job[field] = value;
  logAudit(jobId, null, 'edit', field, old, value);
  document.getElementById('panelTitle').textContent = job.name;
  render();
}

function updateJobRevenue(jobId, val) {
  const job = jobs.find(j => j.id === jobId);
  if (!job) return;
  const old = job.revenue;
  job.revenue = parseFloat(val) || 0;
  recalcJob(jobId);
  logAudit(jobId, null, 'revenue change', 'revenue', fmt$(old), fmt$(job.revenue));
  render();
  renderPanel(jobId);
}

function setJobCT(jobId, ct) {
  const job = jobs.find(j => j.id === jobId);
  if (!job || role !== 'scheduler') return;
  const old = job.customerType;
  job.customerType = ct;
  logAudit(jobId, null, 'edit', 'customerType', old, ct);
  render();
  renderPanel(jobId);
}

function deleteJob(jobId) {
  if (!confirm('Delete this job and all its scheduled days?')) return;
  const job = jobs.find(j => j.id === jobId);
  logAudit(jobId, null, 'delete', null, job?.name, null);
  jobs = jobs.filter(j => j.id !== jobId);
  segments = segments.filter(s => s.jobId !== jobId);
  closePanel();
  render();
  showToast('Job deleted');
}

// ══════════════════════════════════════════════════════════════
//  SEGMENT CRUD
// ══════════════════════════════════════════════════════════════
function addSegment(jobId) {
  const date = document.getElementById('addSegDate').value;
  const installerId = document.getElementById('addSegInst').value || null;
  if (!date) return;
  const seg = { id: 's' + nextSegId++, jobId, installerId, date, dayRevenue: 0, confirmed: false };
  segments.push(seg);
  recalcJob(jobId);
  logAudit(jobId, seg.id, 'create', 'segment', null, date);
  render();
  renderPanel(jobId);
  switchTab('segments');
}

function removeSeg(segId) {
  const seg = segments.find(s => s.id === segId);
  if (!seg) return;
  const jobId = seg.jobId;
  logAudit(jobId, segId, 'delete', 'segment', seg.date, null);
  segments = segments.filter(s => s.id !== segId);
  recalcJob(jobId);
  render();
  renderPanel(jobId);
}

function updateSegInstaller(segId, installerId) {
  const seg = segments.find(s => s.id === segId);
  if (!seg) return;
  const old = installers.find(i => i.id === seg.installerId)?.name || 'Unassigned';
  const newN = installers.find(i => i.id === installerId)?.name || 'Unassigned';
  seg.installerId = installerId || null;
  logAudit(seg.jobId, segId, 'reassign', 'installer', old, newN);
  render();
}

function toggleConfirm(segId) {
  const seg = segments.find(s => s.id === segId);
  if (!seg) return;
  seg.confirmed = !seg.confirmed;
  logAudit(seg.jobId, segId, 'confirm', 'confirmed', String(!seg.confirmed), String(seg.confirmed));
  render();
  renderPanel(seg.jobId);
  switchTab('segments');
}

// ══════════════════════════════════════════════════════════════
//  INSTALLER MANAGER
// ══════════════════════════════════════════════════════════════
const AVATAR_COLORS = ['#2563EB','#7C3AED','#059669','#D97706','#DC2626','#0891B2','#4F46E5','#B45309'];
function installerColor(id) {
  const idx = installers.findIndex(i => i.id === id);
  return AVATAR_COLORS[idx % AVATAR_COLORS.length];
}

function openInstallerModal() {
  renderInstallerList();
  document.getElementById('installerModal').classList.add('open');
}
function closeInstallerModal() {
  document.getElementById('installerModal').classList.remove('open');
  render();
}
function renderInstallerList() {
  document.getElementById('installerList').innerHTML = installers.map(inst => `
    <div class="installer-item">
      <div class="installer-avatar" style="background:${installerColor(inst.id)};width:28px;height:28px;font-size:10px">
        ${inst.name.split(' ').map(w=>w[0]).join('').slice(0,2)}
      </div>
      <div class="installer-item-name">${inst.name}</div>
      <button class="btn-icon danger" onclick="removeInstaller('${inst.id}')" title="Remove">✕</button>
    </div>`).join('');
}
function addInstaller() {
  const name = document.getElementById('newInstallerName').value.trim();
  if (!name) return;
  installers.push({ id: 'i' + Date.now(), name });
  document.getElementById('newInstallerName').value = '';
  renderInstallerList();
}
function removeInstaller(id) {
  if (!confirm('Remove this installer? Their segments will be unassigned.')) return;
  installers = installers.filter(i => i.id !== id);
  segments.forEach(s => { if (s.installerId === id) s.installerId = null; });
  renderInstallerList();
}

// ══════════════════════════════════════════════════════════════
//  PUBLISHING
// ══════════════════════════════════════════════════════════════
function publishWeek() {
  const dates = weekDates();
  document.getElementById('publishRangeLabel').textContent = `${fmtDate(dates[0])} – ${fmtDate(dates[6])}`;
  const actorSel = document.getElementById('publishActor');
  actorSel.innerHTML = installers.map(i => `<option>${i.name}</option>`).join('');
  document.getElementById('publishModal').classList.add('open');
}
function closePublishModal() { document.getElementById('publishModal').classList.remove('open'); }
function confirmPublish() {
  const actor = document.getElementById('publishActor').value;
  const dates = weekDates();
  const wk = weekKey(weekStart);
  const snapshot = {
    publishedAt: new Date().toISOString(),
    publishedBy: actor,
    rangeStart: dates[0],
    rangeEnd: dates[6],
    jobs: jobs.map(j => ({...j})),
    segments: segments.filter(s => dates.includes(s.date)).map(s => ({...s})),
  };
  publishedWeeks[wk] = snapshot;
  closePublishModal();
  updateRevBar(dates);
  showToast(`Schedule published for ${fmtDate(dates[0])} – ${fmtDate(dates[6])}`);
}

// ══════════════════════════════════════════════════════════════
//  AUDIT LOG
// ══════════════════════════════════════════════════════════════
function logAudit(jobId, segId, action, field, before, after, notes) {
  auditLog.push({ jobId, segId, action, field, before, after, notes, actor: lastActor, ts: new Date().toISOString() });
}

// ══════════════════════════════════════════════════════════════
//  TOOLTIP
// ══════════════════════════════════════════════════════════════
function showTooltip(e, segId) {
  const seg = segments.find(s => s.id === segId);
  if (!seg) return;
  const job = jobs.find(j => j.id === seg.jobId);
  if (!job) return;
  const inst = installers.find(i => i.id === seg.installerId);
  const ct = CT[job.customerType] || CT.core;
  const tt = document.getElementById('tooltip');
  const totalSegs = segments.filter(s => s.jobId === job.id).length;

  let html = `<div style="font-weight:700;margin-bottom:5px;color:${ct.color}">${job.name}</div>`;
  html += row('Type', ct.label);
  html += row('Service', job.serviceType || '—');
  if (role !== 'installer') html += row('Day Revenue', fmt$(seg.dayRevenue || 0));
  if (role === 'scheduler') html += row('Total Revenue', fmt$(job.revenue || 0));
  html += row('Installer', inst?.name || 'Unassigned');
  html += row('Days', totalSegs + 'd');
  html += row('City', job.city || '—');
  html += row('ZIP', job.zip || '—');
  if (job.notes) html += `<div style="margin-top:5px;border-top:1px solid #374151;padding-top:4px;color:#D1D5DB;font-size:10px">${esc(job.notes)}</div>`;

  tt.innerHTML = html;
  tt.classList.add('visible');
  moveTooltip(e);
}
function row(label, val) {
  return `<div class="tooltip-row"><span class="tooltip-label">${label}</span><span class="tooltip-val">${val}</span></div>`;
}
function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  const x = Math.min(e.clientX + 14, window.innerWidth - 240);
  const y = Math.min(e.clientY + 14, window.innerHeight - 180);
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }
document.addEventListener('mousemove', e => {
  if (document.getElementById('tooltip').classList.contains('visible')) moveTooltip(e);
});

// ══════════════════════════════════════════════════════════════
//  MONTH DAY CLICK
// ══════════════════════════════════════════════════════════════
function openDayJobs(dateStr2) {
  weekStart = getMonday(new Date(dateStr2 + 'T00:00:00'));
  setView('week');
}

// ══════════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function capitalise(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

// close panel on outside click
document.addEventListener('click', e => {
  const panel = document.getElementById('side-panel');
  const grid = document.getElementById('grid-area');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('.job-card') && e.target.closest('#main')) {
    closePanel();
  }
});
document.getElementById('installerModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeInstallerModal();
});
document.getElementById('publishModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closePublishModal();
});

// ── INIT ──────────────────────────────────────────────────────
setRole('scheduler');
render();
</script>
